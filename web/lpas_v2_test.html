<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>LPAS v2 煙霧測試</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root {
    --bg-color: #2A1A3A;
    --card-bg: rgba(255, 255, 255, 0.08);
    --text-color: #E8E0F5;
    --accent: hsla(296, 56%, 64%, 1);
}

* { box-sizing: border-box; }
body {
    margin: 0;
    padding: 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Microsoft JhengHei", sans-serif;
    background: linear-gradient(135deg, #2A1A3A 0%, #1A1A2E 100%);
    color: var(--text-color);
    min-height: 100vh;
}

.controls {
    max-width: 720px;
    margin: 0 auto 32px;
    background: var(--card-bg);
    padding: 20px;
    border-radius: 12px;
}
.controls h1 { margin: 0 0 12px; font-size: 20px; }
.controls button {
    background: var(--accent);
    color: white;
    border: none;
    padding: 12px 24px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
    margin-right: 8px;
    margin-top: 8px;
}
.controls button:hover { filter: brightness(1.2); }
.controls .pattern-info {
    margin-top: 8px;
    font-size: 14px;
    opacity: 0.7;
}

.result-container {
    max-width: 720px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 20px;
}

#v2-triple {
    background: linear-gradient(135deg, hsla(296, 56%, 64%, 0.3), hsla(266, 56%, 64%, 0.3));
    padding: 32px 24px;
    border-radius: 16px;
    text-align: center;
}
.v2-triple-label {
    font-size: 14px;
    opacity: 0.7;
    letter-spacing: 2px;
}
.v2-triple-text {
    font-size: 36px;
    font-weight: bold;
    margin-top: 8px;
    letter-spacing: 4px;
}

#v2-radar {
    background: var(--card-bg);
    padding: 24px;
    border-radius: 12px;
    height: 480px;
    position: relative;
}
#v2-radar canvas {
    max-height: 380px;
}
.v2-period-switcher {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-top: 16px;
}
.v2-period-btn {
    background: rgba(255,255,255,0.1);
    color: white;
    border: 1px solid rgba(255,255,255,0.2);
    padding: 8px 16px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 14px;
}
.v2-period-btn.active {
    background: white;
    color: #2A1A3A;
    font-weight: bold;
}

#v2-chapters {
    display: flex;
    flex-direction: column;
    gap: 16px;
}
.v2-chapter {
    background: var(--card-bg);
    padding: 20px 24px;
    border-radius: 12px;
}
.v2-chapter-period {
    font-size: 12px;
    opacity: 0.6;
    letter-spacing: 2px;
}
.v2-chapter-typename {
    font-size: 24px;
    margin: 8px 0;
}
.v2-chapter-slogan {
    font-style: italic;
    opacity: 0.85;
    margin: 8px 0 16px;
}
.v2-chapter-body {
    line-height: 1.7;
    opacity: 0.9;
}

.v2-sex-card {
    background: var(--card-bg);
    padding: 20px;
    border-radius: 12px;
    border: 1px dashed rgba(255,255,255,0.2);
}
.v2-sex-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.v2-sex-title {
    font-size: 16px;
    letter-spacing: 1px;
}
.v2-eye-btn {
    background: transparent;
    border: 1px solid rgba(255,255,255,0.3);
    color: white;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 18px;
}
.v2-sex-quadrant {
    margin-top: 16px;
    font-size: 24px;
    font-weight: bold;
    text-align: center;
    color: hsla(326, 70%, 75%, 1);
}
.v2-sex-skipped .v2-sex-text {
    opacity: 0.6;
    text-align: center;
    margin: 12px 0;
}

.v2-script-card {
    background: linear-gradient(135deg, hsla(40, 80%, 60%, 0.2), hsla(20, 80%, 60%, 0.2));
    padding: 24px;
    border-radius: 12px;
    border: 1px solid hsla(40, 80%, 60%, 0.4);
}
.v2-script-ribbon {
    font-size: 12px;
    letter-spacing: 2px;
    opacity: 0.8;
}
.v2-script-name {
    font-size: 24px;
    margin: 8px 0;
    color: hsla(40, 80%, 75%, 1);
}
.v2-script-tagline {
    font-style: italic;
    margin: 8px 0;
}
.v2-script-story {
    line-height: 1.7;
    opacity: 0.9;
    margin: 12px 0;
}
.v2-script-genre {
    font-size: 12px;
    opacity: 0.6;
    margin-top: 8px;
}

.v2-pairing-card {
    background: var(--card-bg);
    padding: 24px;
    border-radius: 12px;
}
.v2-pairing-title {
    margin: 0 0 16px;
    font-size: 18px;
}
.v2-pairing-section {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 12px;
}
.v2-pair-label {
    font-size: 14px;
    min-width: 100px;
}
.v2-pair-chips {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}
.v2-pair-chip {
    background: rgba(255,255,255,0.12);
    padding: 6px 14px;
    border-radius: 16px;
    font-size: 14px;
}
.v2-pairing-note {
    font-size: 12px;
    opacity: 0.5;
    margin-top: 16px;
}

.debug-panel {
    margin-top: 32px;
    padding: 16px;
    background: rgba(0,0,0,0.3);
    border-radius: 8px;
    font-family: monospace;
    font-size: 12px;
    white-space: pre-wrap;
    max-height: 240px;
    overflow: auto;
}
</style>
</head>
<body>

<div class="controls">
    <h1>🧪 LPAS v2 煙霧測試</h1>
    <p>產生隨機作答，驗證 v2 計分與結果頁渲染。</p>

    <button onclick="runTest('princess')">公主-公主-公主</button>
    <button onclick="runTest('classic_break')">公主-女王-浪子（經典劇本）</button>
    <button onclick="runTest('ceo')">總裁-總裁-總裁</button>
    <button onclick="runTest('flower_crash')">浪子-浪子-公主（花心翻車）</button>
    <button onclick="runTest('random')">完全隨機</button>
    <button onclick="runTest('skip_sex')">跳過全部性題</button>

    <div class="pattern-info" id="pattern-info"></div>
</div>

<div class="result-container">
    <div id="v2-triple"></div>
    <div id="v2-radar"></div>
    <div id="v2-chapters"></div>
    <div id="v2-sex"></div>
    <div id="v2-script"></div>
    <div id="v2-pairing"></div>

    <div class="debug-panel" id="debug-panel">— 尚未執行測試 —</div>
</div>

<script src="js/lpas_v2_types.js"></script>
<script src="js/lpas_v2_questions.js"></script>
<script src="js/lpas_v2_scripts.js"></script>
<script src="js/lpas_v2_scoring.js"></script>
<script src="js/lpas_v2_render.js"></script>

<script>
// ============================================================
// 產生模擬作答
// ============================================================
//
// 模式：
//   - 'princess'      → 三階段都是公主 (Fuse-Ver-Rom)
//   - 'classic_break' → 公主-女王-浪子（命中「純真轉黑劇本」）
//   - 'ceo'           → 三階段都是總裁
//   - 'flower_crash'  → 浪子-浪子-公主
//   - 'random'        → 完全隨機分數
//   - 'skip_sex'      → 跳過所有性題

const PATTERN_PROFILES = {
    princess: {
        info: "三階段皆為公主，性象限為深情專一型",
        axisFor: function (period, axis) {
            if (period === 4 && axis === 'sex_emotion') return 'high';
            if (period === 4 && axis === 'sex_openness') return 'low';
            if (axis === 'attachment') return 'high';
            if (axis === 'channel')    return 'high';
            if (axis === 'frame')      return 'high';
            return 'mid';
        }
    },
    classic_break: {
        info: "公主-公主-浪子（命中「純真轉黑劇本」）",
        axisFor: function (period, axis) {
            if (period === 4) return 'mid';
            // 公主 (period 1+2) + 浪子 (period 3)
            if (period === 1 || period === 2) {
                if (axis === 'attachment') return 'high';
                if (axis === 'channel')    return 'high';
                if (axis === 'frame')      return 'high';
            }
            if (period === 3) {
                if (axis === 'attachment') return 'low';
                if (axis === 'channel')    return 'high';
                if (axis === 'frame')      return 'high';
            }
            return 'mid';
        }
    },
    ceo: {
        info: "三階段皆為總裁 (Free-Act-Pra)，性象限為冷靜遊戲型",
        axisFor: function (period, axis) {
            if (period === 4 && axis === 'sex_emotion') return 'low';
            if (period === 4 && axis === 'sex_openness') return 'low';
            if (axis === 'attachment') return 'low';
            if (axis === 'channel')    return 'low';
            if (axis === 'frame')      return 'low';
            return 'mid';
        }
    },
    flower_crash: {
        info: "浪子-浪子-公主（命中「花心翻車劇本」）",
        axisFor: function (period, axis) {
            if (period === 4) return 'mid';
            if (period === 3) {
                // 公主
                if (axis === 'attachment') return 'high';
                if (axis === 'channel')    return 'high';
                if (axis === 'frame')      return 'high';
            } else {
                // 浪子 (Free-Ver-Rom)
                if (axis === 'attachment') return 'low';
                if (axis === 'channel')    return 'high';
                if (axis === 'frame')      return 'high';
            }
            return 'mid';
        }
    },
    random: {
        info: "完全隨機分數",
        axisFor: function (_period, _axis) { return 'random'; }
    },
    skip_sex: {
        info: "跳過所有性題，其他隨機",
        axisFor: function (period, _axis) {
            return period === 4 ? 'skip' : 'random';
        }
    }
};

function biasScore(bias) {
    if (bias === 'high')   return 5 + Math.floor(Math.random() * 3); // 5-7
    if (bias === 'low')    return 1 + Math.floor(Math.random() * 3); // 1-3
    if (bias === 'mid')    return 3 + Math.floor(Math.random() * 3); // 3-5
    return 1 + Math.floor(Math.random() * 7); // 1-7
}

function generateAnswers(profile) {
    // 取出所有題目（用 PART2 做基準，反向題會在 scoring 翻轉）
    const allQuestions = window.LPAS_QUESTIONS_PART2;
    const answers = [];

    allQuestions.forEach(q => {
        const bias = profile.axisFor(q.period, q.axis);

        if (bias === 'skip') {
            answers.push({
                id: q.id,
                period: q.period,
                axis: q.axis,
                direction: q.direction,
                score: null,
                skipped: true
            });
            return;
        }

        // 對該軸的「目標方向」打分。若 direction=-1 表示反向題，要翻轉打分
        let rawScore = biasScore(bias);
        if (q.direction === -1) {
            // 反向題：使用者實際選的分數應該是「對立面」
            // 因為 scoring 會做 (8 - raw) 反轉，所以這裡也要先翻轉
            rawScore = 8 - rawScore;
        }

        answers.push({
            id: q.id,
            period: q.period,
            axis: q.axis,
            direction: q.direction,
            score: rawScore,
            skipped: false
        });
    });

    return answers;
}


// ============================================================
// 執行測試
// ============================================================
function runTest(patternKey) {
    const profile = PATTERN_PROFILES[patternKey];
    document.getElementById('pattern-info').textContent = '📋 ' + profile.info;

    const answers = generateAnswers(profile);
    const result = window.calculateScoresV2(answers);

    // 渲染結果頁
    window.LPASv2Render.renderAll(result, {
        triple:   document.getElementById('v2-triple'),
        radar:    document.getElementById('v2-radar'),
        chapters: document.getElementById('v2-chapters'),
        sex:      document.getElementById('v2-sex'),
        script:   document.getElementById('v2-script'),
        pairing:  document.getElementById('v2-pairing')
    });

    // Debug 面板
    document.getElementById('debug-panel').textContent =
        '== Result Object ==\n' +
        JSON.stringify(result, null, 2);
}

// 自動跑一次預設測試
window.addEventListener('DOMContentLoaded', () => runTest('classic_break'));
</script>

</body>
</html>
