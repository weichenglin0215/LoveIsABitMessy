<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>角色資料編輯器 - LoveIsABitMessy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <!-- 編輯器共用css/editer.css -->
  <link rel="stylesheet" href="css/editer.css">

  <!-- 必填欄位未填時的紅框提示（由 characters_editor_app.js: validateRequiredFields() 套用 .field-invalid 類別） -->
  <style>
    .field-invalid {
      border: 2px solid #e74c3c !important;
      background-color: rgba(231, 76, 60, 0.08) !important;
      box-shadow: 0 0 0 2px rgba(231, 76, 60, 0.15) !important;
    }
  </style>

  <!-- Supabase JS (UMD) -->
  <script src="https://unpkg.com/@supabase/supabase-js@2" defer></script>
  <!-- 中央角色資料與邏輯 -->
  <script src="js/character_logic.js"></script>
  <!-- LPAS v3 類型表（曖昧期 / 熱戀期 / 失戀期 16 型 + 親密關係 4 型） -->
  <script src="js/lpas_v3_types.js"></script>
  <!-- LPAS v1 → v3 自動轉換器（載入舊角色卡時就地補上 lpas_v3） -->
  <script src="js/lpas_v1_to_v3.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/model_options_app.js" defer></script>
  <script src="js/writer_settings_app.js" defer></script>
  <script src="js/characters_editor_app.js"></script>
  <!-- 角色卡類型分析統計邏輯 -->
  <script src="js/character_stats_app.js" defer></script>
  <!-- 公用使用說明彈窗（讀寫官方 note/*.md + 雲端 manual_custom_history） -->
  <script src="js/help_modal.js" defer></script>
  <script src="js/modal_focus_helper.js" defer></script>
</head>

<body>
  <div class="debug-panel">
    <div class="col-left">
      <div class="editor-header">
        <div style="display:flex; align-items:center; gap:12px;">
          <div class="title-xl">🎭 角色資料編輯器</div>
          <button id="btn-help-manual" title="開啟使用說明" onclick="HelpModal.open('character_editor', '🎭 角色資料編輯器 使用說明')"
            style="margin-left:auto; width:36px; height:36px; border-radius:50%; border:2px solid #f472b6; background:#333; color:#f472b6; font-size:18px; font-weight:bold; cursor:pointer; flex-shrink:0;">?</button>
        </div>
        <div class="conn-panel">
          <div class="title-hint">管理 Supabase 雲端角色卡、生日、血型與人格特質</div>
          <div class="title-hint" id="conn-status">🔄 正在自動連線至 Supabase…</div>
        </div>
      </div>
      <div class="editor-container">
        <div class="editor-panel">
          <h2><span class="icon">🎭</span> 登場角色管理</h2>
          <div class="sub-row-group" style="grid-template-columns: 1.5fr auto 1fr 1fr;">
            <select id="char-dropdown">
              <option value="">-- 選擇角色卡 --</option>
            </select>
            <button class="btn-icon" id="btn-char-refresh" title="從雲端重新下載角色卡資料">🔄</button>
            <button class="btn primary-btn" id="btn-char-save-new" title="新增儲存角色卡資料到雲端">☁️🆕 儲存新角色(新增)...</button>
            <button class="btn primary-btn" id="btn-char-save" title="注意：覆蓋雲端角色卡資料">☁️💾 儲存角色(覆蓋)</button>
          </div>

          <div class="field-group">
            <label class="title-sm">角色 ID (ID) - 唯讀</label>
            <input type="text" class="editor-input-text" id="char-id" readonly placeholder="系統自動生成">
          </div>

          <div class="sub-row-group" style="grid-template-columns: 2fr 1fr 1fr 1fr 1fr;">
            <div class="field-group">
              <label class="title-sm">姓名 (Name)</label>
              <input type="text" class="editor-input-text" id="char-name" placeholder="輸入角色姓名">
            </div>
            <div class="field-group">
              <label class="title-sm">性別 (Gender)</label>
              <select class="editor-input" id="char-gender">
                <option value="女" selected>女</option>
                <option value="男">男</option>
              </select>
            </div>
            <div class="field-group">
              <label class="title-sm">身高 (cm)</label>
              <input type="number" class="editor-input" id="char-height" value="165">
            </div>
            <div class="field-group">
              <label class="title-sm">體重 (kg)</label>
              <input type="number" class="editor-input" id="char-weight" value="55">
            </div>
            <div class="field-group">
              <label class="title-sm">上圍 (Bust)</label>
              <select class="editor-input" id="char-bust">
                <option value="無">無</option>
                <option value="A">A</option>
                <option value="B">B</option>
                <option value="C" selected>C</option>
                <option value="D">D</option>
                <option value="E">E</option>
                <option value="F">F</option>
                <option value="G">G</option>
              </select>
            </div>
          </div>

          <div class="sub-row-group" style="grid-template-columns: 1fr 1fr 1fr 1fr;">
            <div class="field-group">
              <label class="title-sm" id="lbl-birthday">生日 (Birthday)</label>
              <input type="date" class="editor-input" id="char-birthday">
            </div>
            <div class="field-group">
              <label class="title-sm">星座 (Zodiac)</label>
              <select class="editor-input" id="char-zodiac">
                <option value="">-- 選擇星座 --</option>
              </select>
            </div>
            <div class="field-group">
              <label class="title-sm">血型 (Blood Type)</label>
              <select class="editor-input" id="char-blood-type">
                <option value="">-- 選擇血型 --</option>
              </select>
            </div>
            <div class="field-group">
              <label class="title-sm">MBTI類型</label>
              <select class="editor-input" id="char-mbti">
                <option value="">-- 選擇MBTI --</option>
              </select>
            </div>
          </div>

          <!-- LPAS v3：曖昧期 / 熱戀期 / 失戀期 / 親密關係 四選單同排 -->
          <div class="sub-row-group" style="grid-template-columns: 1fr 1fr 1fr 1fr;">
            <div class="field-group">
              <label class="title-sm">曖昧期類型</label>
              <select class="editor-input" id="char-type-1">
                <option value="">-- 選擇曖昧期類型 --</option>
              </select>
            </div>
            <div class="field-group">
              <label class="title-sm">熱戀期類型</label>
              <select class="editor-input" id="char-type-2">
                <option value="">-- 選擇熱戀期類型 --</option>
              </select>
            </div>
            <div class="field-group">
              <label class="title-sm">失戀期類型</label>
              <select class="editor-input" id="char-type-3">
                <option value="">-- 選擇失戀期類型 --</option>
              </select>
            </div>
            <div class="field-group">
              <label class="title-sm">親密關係類型</label>
              <select class="editor-input" id="char-type-4">
                <option value="">-- 選擇親密關係類型 --</option>
              </select>
            </div>
          </div>

          <!-- 角色照片：縮圖框 + 上傳按鈕 + 拖曳區 -->
          <div class="field-group">
            <div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:4px;">
              <label class="title-sm" style="margin:0; flex-shrink:0;">角色照片 (Photo)</label>
              <button type="button" class="btn secondary-btn" id="btn-char-photo-upload" title="從電腦選擇圖片檔">📁
                上傳圖片</button>
              <button type="button" class="btn secondary-btn" id="btn-char-photo-clear" title="清除目前的角色照片">🗑️
                清除照片</button>
              <span class="text-muted-sm" id="char-photo-status">尚未上傳照片</span>
              <input type="file" id="char-photo-file-input" accept="image/*" style="display:none;">
            </div>
            <div class="text-center" id="char-photo-dropzone"
              style="width: 160px; height: 160px; background: #333; border: 2px dashed #888; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #888; font-size: 13px; cursor: pointer; user-select: none; overflow: hidden; position: relative"
              title="點擊或拖曳圖片至此上傳">
              <span id="char-photo-placeholder" style="padding:6px;">將圖片拖曳<br>至此或點擊上傳</span>
              <img id="char-photo-thumb" src="" alt=""
                style="display:none; max-width:100%; max-height:100%; object-fit:contain;">
            </div>
          </div>

          <div class="field-group field-group-fill">
            <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:4px;">
              <label class="title-sm" style="margin:0; flex-shrink:0;">角色設定 JSON (Card JSON)</label>
              <button class="btn secondary-btn" id="btn-analyze-clipboard" style="white-space:nowrap;"
                title="從剪貼簿讀取文字，由AI分析並創造角色卡資料">📋 剪貼簿創造角色</button>
              <button class="btn secondary-btn" id="btn-analyze-text" style="white-space:nowrap;"
                title="讀取文字檔案由AI分析並創造角色卡資料">📝
                文字創造角色</button>
              <button class="btn secondary-btn" id="btn-analyze-image" style="white-space:nowrap;"
                title="讀取人像圖片由AI分析並寫出生圖提示詞">🖼️
                人像圖片生成提示詞</button>
            </div>
            <textarea class="editor-textarea" style="height: 40px;" id="char-card-json"
              placeholder="JSON 內容會顯示在此。"></textarea>
          </div>
          <!-- 伺服器狀態 + 模型設定 -->
          <div class="server-status-row server-settings-row">
            <span class="server-status-dot offline" id="server-dot"></span>
            <span class="title-hint" id="server-status-text">偵測中…</span>
            <button id="start-server-btn" disabled>🚀 請自行啟動伺服器</button>
            <div id="model-container" class="model-container-row">
              <label class="model-label">🤖 AI 模型：</label>
              <select id="model-select" class="select-narrow">
                <option value="gemma4">gemma4</option>
              </select>
            </div>
            <div class="model-container-row">
              <label class="model-label">⚙️ 模型參數：</label>
              <select id="model-options-select" class="select-narrow">
                <option value="">預設</option>
              </select>
              <button id="btn-add-model-option" class="ai-btn size-md">+編輯</button>
            </div>
            <div class="model-container-row">
              <label class="model-label">🖋️ 寫作風格：</label>
              <select id="writer-style-select" class="ws-style-dropdown select-narrow">
                <option value="">無</option>
              </select>
              <button id="btn-edit-writer-style" class="ai-btn size-md"
                onclick="WriterSettingsApp.openStyleModal(document.getElementById('writer-style-select').value)">+編輯</button>
            </div>
            <div class="model-container-row">
              <label class="model-label">📝 寫作範本：</label>
              <select id="writer-sample-select" class="ws-sample-dropdown select-narrow">
                <option value="">無</option>
              </select>
              <button id="btn-edit-writer-sample" class="ai-btn size-md"
                onclick="WriterSettingsApp.openSampleModal(document.getElementById('writer-sample-select').value)">+編輯</button>
            </div>
          </div>
          <!-- AI 分析 LOG -->
          <div class="form-section" style="margin-top:4px;">
            <textarea id="editor-log-output" class="log-area">等待任務...</textarea>
          </div>
          <div class="log-actions">
            <button class="small-btn" onclick="clearEditorLog()" title="清空LOG欄的所有文字">🗑️清空</button>
            <button class="small-btn" onclick="copyEditorLog()" title="複製LOG欄的所有文字到剪貼簿">📋複製</button>
            <button class="small-btn" onclick="showEditorLogModal()" title="將LOG欄的所有文字顯示在大型LOG彈窗">🔲大型彈窗</button>
          </div>
          <div class="title-hint">💡 儲存角色時會自動同步更新 Supabase 中的 characters 資料表。</div>
        </div>
      </div>
    </div>
    <div class="col-right">
      <div style="display:flex; align-items:center; justify-content:space-between; gap:8px;">
        <label class="title-sm" style="margin:0;">人格特質與類型說明 (唯讀)</label>
        <button class="btn secondary-btn" id="btn-open-char-stats" title="開啟角色卡類型分析統計彈窗">📊 角色卡類型分析統計</button>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <label class="title-sm">♈♉♊♋♌♍♎♏♐♑♒♓星座說明 (唯讀🔻)</label>
        <textarea class="editor-textarea desc-textarea" id="desc-zodiac" readonly placeholder="星座說明"></textarea>
        <label class="title-sm">🅰🅱🆎🅾血型說明 (唯讀🔻)</label>
        <textarea class="editor-textarea desc-textarea" id="desc-blood" readonly placeholder="血型說明"></textarea>
        <label class="title-sm">🔷MBTI說明 (唯讀🔻)</label>
        <textarea class="editor-textarea desc-textarea" id="desc-mbti" readonly placeholder="MBTI說明"></textarea>
        <label class="title-sm">💜曖昧期說明 (唯讀🔻)</label>
        <textarea class="editor-textarea desc-textarea" id="desc-type-1" readonly placeholder="曖昧期說明"></textarea>
        <label class="title-sm">🧡熱戀期說明 (唯讀🔻)</label>
        <textarea class="editor-textarea desc-textarea" id="desc-type-2" readonly placeholder="熱戀期說明"></textarea>
        <label class="title-sm">💔失戀期說明 (唯讀🔻)</label>
        <textarea class="editor-textarea desc-textarea" id="desc-type-3" readonly placeholder="失戀期說明"></textarea>
        <label class="title-sm">🔥親密關係說明 (唯讀🔻)</label>
        <textarea class="editor-textarea desc-textarea" id="desc-type-4" readonly placeholder="親密關係說明"></textarea>
      </div>
    </div>
  </div>

  <!-- ── Modal: 指定要分析的角色名稱 ── -->
  <div id="modal-target-char-name" class="modal-overlay hidden">
    <div class="modal-box modal-box-sm">
      <h3 class="modal-title">🎯 請輸入要分析的角色名稱</h3>
      <p class="modal-desc" style="margin:0 0 10px; font-size:0.85rem; color: var(--c-text-sub);">
        故事中可能有多個角色，請輸入您想分析的<strong>單一角色姓名</strong>，讓 AI 聚焦分析該角色。
      </p>
      <div class="modal-field">
        <label class="modal-label">角色姓名：</label>
        <input type="text" id="target-char-name-input" class="editor-input-text w-fill" placeholder="例如：林小雨、陳浩然…"
          autocomplete="off" style="box-sizing:border-box">
      </div>
      <div class="modal-actions" style="margin-top:16px;">
        <button id="btn-target-char-cancel" class="btn-modal cancel">取消</button>
        <button id="btn-target-char-confirm" class="btn-modal primary">開始分析</button>
      </div>
    </div>
  </div>

  <!-- ── Modal: 角色卡類型分析統計 ── -->
  <div id="modal-char-stats" class="modal-overlay hidden">
    <div class="modal-box modal-box-lg" style="padding:0; background:#222;">
      <div class="modal-header-bar">
        <h2 class="modal-title" style="flex:1;">📊 角色卡類型分析統計</h2>
        <button class="btn secondary-btn" id="btn-char-stats-refresh" title="從雲端重新下載角色卡與 lpas_results 資料">🔄
          更新雲端角色卡資料</button>
        <button class="modal-close-btn" id="btn-char-stats-close" style="margin-left:10px;">&times;</button>
      </div>
      <div class="modal-body-area" style="flex-direction:row; padding:8px; gap:8px; background:hsl(0, 0%, 0%);">
        <!-- 左直排 50% -->
        <div id="char-stats-col-left" class="char-stats-col"
          style="flex:0 0 50%; min-width:0; overflow-y:auto; background:#222; border:1px solid #444; border-radius:10px; padding:10px;">
          <h3 class="text-pink" style="margin: 0 0 8px">角色卡欄位統計</h3>
          <div id="char-stats-section-A" class="char-stats-section"></div>
          <div id="char-stats-section-B" class="char-stats-section"></div>
          <div id="char-stats-section-C" class="char-stats-section"></div>
          <!-- D/E/F 三期 LPAS 共用一個 label，三欄橫放 -->
          <div id="char-stats-section-DEF" class="char-stats-section"></div>
        </div>
        <!-- 中間直排 20% -->
        <div id="char-stats-col-mid" class="char-stats-col"
          style="flex:0 0 20%; min-width:0; overflow-y:auto; background:#222; border:1px solid #444; border-radius:10px; padding:10px;">
          <h3 class="text-pink" style="margin: 0 0 8px">LPAS_評價分數分析</h3>
          <div id="char-stats-section-G" class="char-stats-section"></div>
          <div id="char-stats-section-H" class="char-stats-section"></div>
          <div id="char-stats-section-I" class="char-stats-section"></div>
        </div>
        <!-- 右直排 30% -->
        <div id="char-stats-col-right" class="char-stats-col"
          style="flex:0 0 30%; min-width:0; overflow-y:auto; background:#222; border:1px solid #444; border-radius:10px; padding:10px;">
          <h3 class="text-pink" id="char-stats-detail-title" style="margin: 0 0 8px">細節列表</h3>
          <div id="char-stats-detail-body" style="color:#ccc; font-size:1.2rem;">
            👈 請點擊左方或中間的 A~I 項目以顯示對應的角色卡列表。
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ── Modal: 角色卡內容 ── -->
  <div id="modal-char-card-view" class="modal-overlay hidden">
    <div class="modal-box"
      style="width:60%; max-width:60%; height:90%; display:flex; flex-direction:column; padding:0;">
      <div class="modal-header-bar">
        <h2 class="modal-title" id="char-card-view-title" style="flex:1;">角色卡內容</h2>
        <button class="modal-close-btn" id="btn-char-card-view-close">&times;</button>
      </div>
      <div class="modal-body-area" style="padding:8px;">
        <textarea id="char-card-view-textarea" class="modal-log-textarea" readonly></textarea>
      </div>
    </div>
  </div>

  <!-- ── Modal: Editor AI 分析 LOG ── -->
  <div id="modal-editor-log" class="modal-overlay hidden">
    <div class="modal"
      style="background-color: var(--c-bg-card-light); width: 80%; height: 80%; display: flex; flex-direction: column; max-width: none;">
      <div class="modal-header-bar"
        style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-shrink: 0;">
        <h2 class="modal-title" style="margin:0;">AI 分析 LOG</h2>
        <button class="modal-close-btn"
          onclick="document.getElementById('modal-editor-log').classList.add('hidden')">&times;</button>
      </div>
      <div class="log-search-bar" style="flex-shrink: 0;">
        <span class="log-search-icon">🔍</span>
        <span id="editor-log-search-count" class="log-search-count"></span>
        <button class="log-search-nav-btn" id="editor-log-search-prev" title="上一個">▲</button>
        <button class="log-search-nav-btn" id="editor-log-search-next" title="下一個">▼</button>
        <input type="text" id="editor-log-search-input" class="log-search-input" placeholder="搜尋 LOG 文字（Enter 執行）...">
      </div>
      <div class="modal-body-area">
        <textarea id="editor-log-content" class="modal-log-textarea" readonly></textarea>
      </div>
    </div>
  </div>

</body>

</html>
