<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LPAS 數據分析後台</title>
    <!-- 引用後台管理共用主題樣式表 -->
    <link rel="stylesheet" href="css/admin_theme.css">
    <!-- Chart.js：用於繪製本頁面各種統計圖表的第三方函式庫 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Supabase SDK：用於連線資料庫，讀取評量數據 -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body class="admin-body">
    <!-- 頁首區塊：標題與日期篩選列 -->
    <header class="admin-header">
        <div class="admin-title">
            <h1>LPAS 愛情人格評量數據分析</h1>
        </div>
        <!-- 篩選列：可選擇日期區間並按下按鈕重新查詢分析結果 -->
        <div class="filter-bar">
            <div class="filter-group">
                <label>開始日期</label>
                <input type="date" id="start-date">
            </div>
            <div class="filter-group">
                <label>結束日期</label>
                <input type="date" id="end-date">
            </div>
            <!-- 按下後由 JS 重新抓取資料並更新所有圖表 -->
            <button class="btn-refresh" id="btn-refresh">更新分析</button>
        </div>
    </header>

    <main>
        <!-- 頂部概覽：四個統計方塊，顯示各階段平均準確度與總樣本數 -->
        <div class="stats-summary">
            <div class="stat-box c1">
                <div class="stat-label">曖昧期平均準確度</div>
                <div class="stat-value" id="avg-score-ambiguity">0.0</div>
            </div>
            <div class="stat-box c2">
                <div class="stat-label">熱戀期平均準確度</div>
                <div class="stat-value" id="avg-score-love">0.0</div>
            </div>
            <div class="stat-box c3">
                <div class="stat-label">失戀期平均準確度</div>
                <div class="stat-value" id="avg-score-breakup">0.0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">總樣本數</div>
                <div class="stat-value" id="total-samples">0</div>
            </div>
        </div>

        <!-- 圖表區塊：以格線排列四張分析圖表，各圖表由對應的 canvas 交給 Chart.js 繪製 -->
        <div class="dashboard-grid">
            <!-- 圖表 1：曖昧期／熱戀期／失戀期三階段的正確性平均分數 (1-5 星) -->
            <div class="chart-card">
                <h3>三階段評量正確性平均 (1-5 星)</h3>
                <div class="chart-container">
                    <canvas id="chart-avg-correctness"></canvas>
                </div>
            </div>

            <!-- 圖表 2：三階段正確性隨日期變化的趨勢線 -->
            <div class="chart-card">
                <h3>三階段正確性日趨勢</h3>
                <div class="chart-container">
                    <canvas id="chart-daily-trend"></canvas>
                </div>
            </div>

            <!-- 圖表 3：準確度評分與平均作答時間（秒）的關聯性 -->
            <div class="chart-card">
                <h3>準確度評分與平均作答時間 (秒)</h3>
                <div class="chart-container">
                    <canvas id="chart-time-correlation"></canvas>
                </div>
            </div>

            <!-- 圖表 4：各人格類型在三階段中的分布統計，內容較多故需佔較大版面 -->
            <div class="chart-card" style="grid-column: span 1;">
                <h3>三階段人格類型分布統計</h3>
                <div class="chart-container large">
                    <canvas id="chart-type-distribution"></canvas>
                </div>
            </div>
        </div>
    </main>

    <!-- 引入 Supabase 連線設定，供本頁資料查詢使用 -->
    <script src="js/supabaseClient.js"></script>
    <!-- 引入本頁主要邏輯：抓取數據並渲染上方各圖表 -->
    <script src="js/lpas_analytics_app.js"></script>
</body>
</html>
