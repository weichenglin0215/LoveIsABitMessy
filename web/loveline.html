<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LoveLine 💬 - LoveIsABitMessy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/editer.css">
  <script src="https://unpkg.com/@supabase/supabase-js@2" defer></script>
  <script src="js/supabaseClient.js" defer></script>
  <script src="js/model_options_app.js" defer></script>
  <script src="js/writer_settings_app.js" defer></script>

</head>

<body>
  <!-- Top Bar -->
  <div class="app-topbar">
    <span class="app-title-small">💌 LoveLine</span>
    <nav class="app-topbar-nav">
      <a href="index.html">🏠 首頁</a>
      <a href="characters_editor.html">🎭 角色編輯</a>
      <a href="daily_run.html">📅 每日日記</a>
      <a href="loveline.html" class="active">💬 LoveLine 聊天</a>
      <a href="novel_generator.html">📖 小說生成器</a>
    </nav>
  </div>

  <!-- Main 3-column layout -->
  <div class="app-shell" id="app-shell">

    <!-- ═══ LEFT PANEL ═══ -->
    <div class="panel" id="panel-left">
      <!-- Header with collapse button -->
      <div class="panel-header">
        <span class="left-content" style="font-size:0.85rem;">⚙️ 控制台</span>
        <button class="collapse-btn" id="btn-collapse-left" title="縮放左側欄">◀</button>
      </div>

      <div class="left-content" style="flex:1;display:flex;flex-direction:column;overflow:hidden;">
        <!-- User Section -->
        <div class="user-section">
          <div class="user-row" id="current-user-row">
            <div class="user-avatar" id="user-avatar-icon">👤</div>
            <div style="flex:1;">
              <div class="user-name" id="current-user-name">— 請選擇 —</div>
              <div style="font-size:0.7rem;color:var(--c-text-sec);">目前使用者</div>
            </div>
            <button id="btn-edit-user-profile" title="編輯使用者資料"
              style="background:none;border:none;color:var(--c-accent-light);cursor:pointer;font-size:1.1rem;">⚙️</button>
          </div>
          <label>選擇使用者</label>
          <select id="user-select">
            <option value="">— 請選擇 —</option>
          </select>
          <div style="margin-top:8px;display:flex;gap:6px;">
            <input type="text" id="new-user-input" placeholder="新增使用者名稱..." style="flex:1;">
            <button id="btn-add-user"
              style="background:var(--c-accent);border:none;color:#fff;border-radius:6px;padding:4px 10px;cursor:pointer;font-size:0.8rem;">+新增</button>
          </div>
        </div>

        <!-- Server Status -->
        <div class="server-section">
          <div class="server-row">
            <div class="dot" id="server-dot"></div>
            <span class="server-label" id="server-status-text">偵測中…</span>
          </div>
          <div class="model-select-wrap">
            <label style="font-size:0.85rem;color:var(--c-text-sec);display:block;margin-bottom:3px;">🤖 AI
              模型</label>
            <select id="model-select">
              <option value="gemma4">gemma4</option>
            </select>
          </div>
          <div class="model-select-wrap" style="margin-top:10px;">
            <label style="font-size:0.85rem;color:var(--c-text-sec);display:block;margin-bottom:3px;">⚙️
              模型參數</label>
            <div style="display:flex; gap:4px;">
              <select id="model-options-select" style="flex:1;">
                <option value="">預設</option>
              </select>
              <button id="btn-add-model-option"
                style="background:var(--c-accent);border:none;color:#fff;border-radius:4px;padding:2px 8px;cursor:pointer;">編輯</button>
            </div>
          </div>
          <div class="model-select-wrap" style="margin-top:10px;">
            <label style="font-size:0.85rem;color:var(--c-text-sec);display:block;margin-bottom:3px;">🖋️
              寫作風格</label>
            <div style="display:flex; gap:4px;">
              <select id="writer-style-select" class="ws-style-dropdown" style="flex:1;">
                <option value="">無</option>
              </select>
              <button id="btn-edit-writer-style"
                style="background:var(--c-accent);border:none;color:#fff;border-radius:4px;padding:2px 8px;cursor:pointer;"
                onclick="WriterSettingsApp.openStyleModal(document.getElementById('writer-style-select').value)">編輯</button>
            </div>
          </div>
          <div class="model-select-wrap" style="margin-top:10px;">
            <label style="font-size:0.85rem;color:var(--c-text-sec);display:block;margin-bottom:3px;">📝
              寫作範本</label>
            <div style="display:flex; gap:4px;">
              <select id="writer-sample-select" class="ws-sample-dropdown" style="flex:1;">
                <option value="">無</option>
              </select>
              <button id="btn-edit-writer-sample"
                style="background:var(--c-accent);border:none;color:#fff;border-radius:4px;padding:2px 8px;cursor:pointer;"
                onclick="WriterSettingsApp.openSampleModal(document.getElementById('writer-sample-select').value)">編輯</button>
            </div>
          </div>
          <div class="log-box" id="log-output">等待中…</div>
          <div class="log-actions-sm">
            <button class="btn secondary-btn log-action-btn" onclick="clearLogOutput()">🗑️清空</button>
            <button class="btn secondary-btn log-action-btn" onclick="copyLogOutput()">📋複製</button>
            <button class="btn secondary-btn log-action-btn" onclick="showLogModal()">🔲大型彈窗</button>
          </div>
        </div>
      </div>

      <!-- collapsed icon -->
      <div id="collapsed-icon"
        style="display:none;flex-direction:column;align-items:center;padding:8px;gap:8px;writing-mode:vertical-rl;">
        <span style="font-size:0.7rem;color:var(--c-text-sec);">控制台</span>
      </div>
    </div>

    <!-- ═══ MIDDLE PANEL ═══ -->
    <div class="panel" id="panel-mid">
      <div class="panel-header">
        <span>💬 聊天</span>
      </div>
      <div class="panel-scroll">
        <!-- 1-on-1 -->
        <div class="list-section-title">
          <span>👤 好友</span>
          <button id="btn-new-1on1" title="加入好友">＋</button>
        </div>
        <div id="list-1on1">
          <div style="font-size:0.75rem;color:#555;padding:6px 8px;">尚無好友</div>
        </div>
        <!-- Group -->
        <div class="list-section-title" style="margin-top:10px;">
          <span>👥 聊天室</span>
          <button id="btn-new-group" title="建立多人聊天室">＋</button>
        </div>
        <div id="list-group">
          <div style="font-size:0.75rem;color:#555;padding:6px 8px;">尚無聊天室</div>
        </div>
      </div>
    </div>

    <!-- ═══ RIGHT PANEL ═══ -->
    <div class="panel" id="panel-right">
      <div id="chat-header">
        <div class="chat-avatar" id="chat-header-avatar">💬</div>
        <div>
          <div id="chat-title">請選擇一個對話</div>
          <div id="chat-subtitle" style="font-size:0.72rem;color:var(--c-text-sec);"></div>
        </div>
        <div style="margin-left:auto;display:flex;gap:6px;">
          <button id="btn-clear-chat" title="清空畫面"
            style="background:none;border:none;color:#666;cursor:pointer;font-size:1rem;padding:4px 8px;border-radius:6px;"
            disabled>🗑️</button>
        </div>
      </div>

      <div id="chat-messages"></div>

      <div class="empty-chat" id="empty-state" style="display: flex;">
        <div class="icon">💌</div>
        <p>選擇角色或聊天室開始聊天</p>
      </div>

      <div id="chat-input-area">
        <textarea id="msg-input" rows="1" placeholder="輸入訊息…（Shift+Enter 換行，Enter 送出）" disabled></textarea>
        <button id="btn-send" disabled>➤</button>
      </div>
    </div>
  </div>


  <!-- ── Modal: Edit User Profile ── -->
  <div class="modal-overlay hidden" id="modal-user-edit">
    <div class="modal" style="width: 640px;">
      <h3 id="modal-user-title">👤 編輯使用者資料</h3>
      <label>暱稱</label>
      <input type="text" id="modal-user-name" placeholder="輸入您的暱稱">

      <label>登入密碼 (必要)</label>
      <input type="password" id="modal-user-password" placeholder="輸入登入密碼"
        style="background: rgba(0, 0, 0, 0.4); border: 1px solid var(--c-border); color: #fff; border-radius: 8px; padding: 7px 10px; width: 100%;">

      <label>關聯角色卡 (選填)</label>
      <select id="modal-user-char-select">
        <option value="">— 無 —</option>
      </select>

      <label>覆蓋設定的資料 (關鍵字會覆蓋，如：生日: 01-01, 血型: O...)</label>
      <textarea id="modal-user-persona" rows="6" placeholder="在此輸入要覆寫角色卡的資料內容...例如：生日、血型、星座..."></textarea>

      <label>額外補充的資料 (將直接加入 AI 提示詞)</label>
      <textarea id="modal-user-extra" rows="6" placeholder="在此輸入更多關於使用者的描述..."></textarea>

      <div class="modal-actions">
        <button class="btn-modal cancel" id="btn-modal-user-cancel">取消</button>
        <button class="btn-modal primary" id="btn-modal-user-ok">儲存設定</button>
      </div>
    </div>
  </div>

  <!-- ── Modal: Friend (Add / Edit) ── -->
  <div class="modal-overlay hidden" id="modal-friend">
    <div class="modal" style="width: 480px;">
      <h3 id="modal-friend-title">💬 新增好友</h3>
      <label>好友名稱 (暱稱)</label>
      <input type="text" id="modal-friend-name" placeholder="預設空白，不可與現有其他好友同名">

      <label>關聯角色卡 (選填)</label>
      <select id="modal-friend-char-select">
        <option value="">— 讀取中 —</option>
      </select>

      <label>覆蓋好友角色資料 (關鍵字覆蓋，如：生日: 01-01, 血型: O...)</label>
      <textarea id="modal-friend-persona" placeholder="在此輸入要覆寫角色卡的資料內容..."></textarea>

      <label>額外補充好友資料 (將直接加入 AI 提示詞)</label>
      <textarea id="modal-friend-extra" placeholder="在此輸入更多關於此好友的補充描述..."></textarea>

      <div class="modal-actions">
        <button class="btn-modal cancel" id="btn-modal-friend-cancel">取消</button>
        <button class="btn-modal" id="btn-modal-friend-delete"
          style="background:rgba(244,67,54,0.2);color:#f44336;margin-right:auto;">🗑️ 刪除</button>
        <button class="btn-modal primary" id="btn-modal-friend-ok">儲存</button>
      </div>
    </div>
  </div>

  <!-- ── Modal: Group Chat (Add / Edit) ── -->
  <div class="modal-overlay hidden" id="modal-group">
    <div class="modal" style="width: 480px;">
      <h3 id="modal-group-title">👥 建立聊天室</h3>
      <label>聊天室名稱</label>
      <input type="text" id="modal-group-name" placeholder="例如：班級群組、約會計劃">

      <label>選擇參與角色（可多選）</label>
      <div class="char-check-list" id="modal-group-chars"></div>

      <label>聊天室背景資料</label>
      <textarea id="modal-group-bg-data" placeholder="備註這個聊天室該注意的事項或劇情導向..."></textarea>

      <div class="modal-actions">
        <button class="btn-modal cancel" id="btn-modal-group-cancel">取消</button>
        <button class="btn-modal" id="btn-modal-group-delete"
          style="background:rgba(244,67,54,0.2);color:#f44336;margin-right:auto;display:none;">🗑️ 刪除</button>
        <button class="btn-modal primary" id="btn-modal-group-ok">儲存</button>
      </div>
    </div>
  </div>


  <!-- ── Modal: Password Check ── -->
  <div class="modal-overlay hidden" id="modal-password-check">
    <div class="modal" style="width: 360px;">
      <h3 id="password-check-title">🔐 安全驗證</h3>
      <p id="password-check-msg" style="font-size: 0.85rem; color: var(--c-text-sec); margin-bottom: 12px;">
        請輸入該使用者的登入密碼以載入資料：</p>
      <input type="password" id="password-input-val" placeholder="輸入密碼..." style="margin-bottom: 20px;">
      <div class="modal-actions" style="display: flex; justify-content: flex-end; gap: 10px;">
        <button class="btn-modal cancel" id="btn-password-cancel">取消</button>
        <button class="btn-modal primary" id="btn-password-ok">確定</button>
      </div>
    </div>
  </div>

  <script>
    // Log 輔助功能
    window.clearLogOutput = () => {
      const logBox = document.getElementById('log-output');
      if (logBox) logBox.textContent = '';
    };
    window.copyLogOutput = () => {
      const logBox = document.getElementById('log-output');
      navigator.clipboard.writeText(logBox ? logBox.textContent : '');
      alert('已複製到剪貼簿');
    };
    window.showLogModal = () => {
      const logBox = document.getElementById('log-output');
      const rawText = logBox ? (logBox.innerText || logBox.textContent) : '';
      document.getElementById('system-log-content').value = rawText.replace(/\\n/g, '\n');
      document.getElementById('modal-system-log').style.display = 'flex';
      document.getElementById('log-search-input').value = '';
      document.getElementById('log-search-count').textContent = '';
    };

    // LOG 彈窗搜尋功能
    (function initLogSearch() {
      let matches = [], currentMatch = -1;

      function goToMatch(idx) {
        if (!matches.length) return;
        const ta = document.getElementById('system-log-content');
        const query = document.getElementById('log-search-input').value;
        currentMatch = ((idx % matches.length) + matches.length) % matches.length;
        const start = matches[currentMatch], end = start + query.length;
        ta.focus();
        ta.setSelectionRange(start, end);
        const lh = parseFloat(window.getComputedStyle(ta).lineHeight) || 20;
        ta.scrollTop = Math.max(0, (ta.value.substring(0, start).split('\n').length - 4) * lh);
        document.getElementById('log-search-count').textContent = `${currentMatch + 1} / ${matches.length}`;
      }

      function doSearch() {
        const query = document.getElementById('log-search-input').value;
        const ta = document.getElementById('system-log-content');
        const countEl = document.getElementById('log-search-count');
        matches = []; currentMatch = -1;
        if (!query) { countEl.textContent = ''; ta.focus(); return; }
        const lo = ta.value.toLowerCase(), lq = query.toLowerCase();
        let i = 0;
        while ((i = lo.indexOf(lq, i)) !== -1) { matches.push(i); i += lq.length; }
        matches.length ? goToMatch(0) : (countEl.textContent = '找不到', ta.focus());
      }

      window.addEventListener('DOMContentLoaded', () => {
        document.getElementById('log-search-input').addEventListener('keydown', e => {
          if (e.key === 'Enter') { e.preventDefault(); doSearch(); }
        });
        document.getElementById('log-search-prev').addEventListener('click', () => goToMatch(currentMatch - 1));
        document.getElementById('log-search-next').addEventListener('click', () => goToMatch(currentMatch + 1));
      });
    })();
  </script>
  <script src="js/loveline_app.js" defer></script>
  <!-- ── Modal: System Message LOG ── -->
  <div id="modal-system-log" style="display:none;">
    <div class="modal-box modal-box-lg">
      <div class="modal-header-bar">
        <button class="modal-close-btn"
          onclick="document.getElementById('modal-system-log').style.display='none'">&times;</button>
        <h3 class="modal-title">系統訊息 LOG</h3>
      </div>
      <div class="log-search-bar">
        <span class="log-search-icon">🔍</span>
        <span id="log-search-count" class="log-search-count"></span>
        <button class="log-search-nav-btn" id="log-search-prev" title="上一個">▲</button>
        <button class="log-search-nav-btn" id="log-search-next" title="下一個">▼</button>
        <input type="text" id="log-search-input" class="log-search-input" placeholder="搜尋 LOG 文字（Enter 執行）...">
      </div>
      <div class="modal-body-area">
        <textarea id="system-log-content" class="modal-log-textarea" readonly></textarea>
      </div>
    </div>
  </div>
</body>

</html>
