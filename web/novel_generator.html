<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小說自動產生器 - LoveIsABitMessy</title>
  <!-- Supabase JS (UMD) -->
  <script src="https://unpkg.com/@supabase/supabase-js@2" defer></script>
  <script src="js/supabaseClient.js" defer></script>
  <script src="js/model_options_app.js" defer></script>
  <script src="js/writer_settings_app.js" defer></script>
  <!-- 編輯器共用css/editer.css -->
  <link rel="stylesheet" href="css/editer.css">
</head>

<body>
  <div class="app-topbar">
    <div class="app-title-small">📖 開心花園AI小說自動產生器 <small class="nav-version">v1.0</small></div>
    <nav class="app-topbar-nav">
      <label class="nav-label">小說名稱：</label>
      <div class="book-title">
        <input type="text" id="book-title" placeholder="請輸入小說名稱...">
      </div>
      <button class="btn secondary-btn" id="btn-export">📤 匯出小說</button>
      <div class="cloud-load-wrapper">
        <button class="btn secondary-btn" id="btn-load-cloud">☁️ 讀取雲端小說</button>
        <select id="cloud-novel-select" style="display:none; height: 32px;">
          <option value="">-- 請選擇小說 --</option>
        </select>
      </div>
      <button class="btn secondary-btn" id="btn-load">📂 讀取小說</button>
      <button class="btn primary-btn" id="btn-save">💾 儲存小說</button>
    </nav>
  </div>
  <div id="main-columns-grid" class="main-columns-grid">
    <!-- 角色挑選 -->
    <div class="col" id="char-col-container">
      <div class="col-header">
        <button class="collapse-btn" id="toggle-char-col" title="縮放">↔</button>
        <h3>🎭 登場角色</h3>
        <div class="toolbox">
          <button class="btn-circle" id="add-char" title="增加角色">+</button>
        </div>
      </div>
      <div class="scroll-area-char-card" id="char-list">
        <div class="char-mode-toggle">
          <label class="checkbox-label">
            <input type="checkbox" id="use-local-data"> 讀取本機資料 (除錯用)
          </label>
          <div id="char-source-status">☁️ 預設讀取雲端角色卡</div>
        </div>
        <div id="char-slots-container">
          <!-- JS 動態生成 -->
        </div>
      </div>
      <!--LOG狀態欄-->
      <div class="server-status-row server-settings-row">
        <span class="server-status-dot offline" id="server-dot"></span>
        <span class="server-status-text" id="server-status-text">偵測中…</span>
        <button id="start-server-btn" disabled>🚀 請自行啟動伺服器</button>
        <div id="model-container" class="model-container-row">
          <label class="model-label">🤖 AI 模型：</label>
          <select id="model-select" class="select-narrow">
            <option value="gemma4">gemma4</option>
          </select>
        </div>
        <div class="model-container-row">
          <label class="model-label">⚙️ 模型參數：</label>
          <select id="model-options-select" class="select-narrow">
            <option value="">預設</option>
          </select>
          <button id="btn-add-model-option" class="ai-btn btn-edit-sm">+編輯</button>
        </div>
        <div class="model-container-row">
          <label class="model-label">🖋️ 寫作風格：</label>
          <select id="writer-style-select" class="ws-style-dropdown">
            <option value="">無</option>
          </select>
          <button id="btn-edit-writer-style" class="ai-btn btn-edit-sm"
            onclick="WriterSettingsApp.openStyleModal(document.getElementById('writer-style-select').value)">+編輯</button>
        </div>
        <div class="model-container-row">
          <label class="model-label">📝 寫作範本：</label>
          <select id="writer-sample-select" class="ws-sample-dropdown">
            <option value="">無</option>
          </select>
          <button id="btn-edit-writer-sample" class="ai-btn btn-edit-sm"
            onclick="WriterSettingsApp.openSampleModal(document.getElementById('writer-sample-select').value)">+編輯</button>
        </div>
      </div>
      <!-- LOG -->
      <div class="form-section">
        <textarea id="log-output" class="log-area">等待任務...</textarea>
      </div>
      <div class="log-actions">
        <button class="small-btn" onclick="clearLogOutput()">🗑️清空</button>
        <button class="small-btn" onclick="copyLogOutput()">📋複製</button>
        <button class="small-btn" onclick="showLogModal()">🔲大型彈窗</button>
      </div>
      <div id="diary-cloud-status" class="cloud-status">雲端狀態</div>
    </div>

    <div class="resizer" data-index="1"></div>

    <!-- 故事粗綱欄位 -->
    <div class="col" id="story-premise-container">
      <div class="col-header">
        <button class="collapse-btn" id="toggle-premise" title="縮放">↔</button>
        <h3>📝故事粗綱</h3>
        <div class="toolbox">
          <button class="ai-btn" id="btn-ai-gen-full-auto" title="全自動生成所有文字：依粗綱生成章節→節大綱→節內文（跳過已鎖定）"
            style="color: #FFFFFF; background:linear-gradient(135deg,#7c3aed,#f472b6); font-weight:bold;">🚀
            全自動</button>
          <button class="ai-btn" id="btn-ai-gen-chapters" title="根據粗綱生成各章標題、章描述">🤖 AI各章描述</button>
        </div>
      </div>
      <div class="scroll-area">
        <textarea class="story-premise-textarea" id="story-premise" placeholder="在此編寫故事粗綱，包含整體走向、結局設想等..."></textarea>
      </div>
    </div>

    <div class="resizer" data-index="3"></div>

    <!-- 故事大綱 -->
    <div class="col">
      <div class="col-header">
        <h3>📖 故事大綱</h3>
        <div class="toolbox">
          <button class="ai-btn" id="btn-ai-gen-all-outlines" title="撰寫所有未鎖定的小節大綱">🤖 AI 撰寫所有大綱</button>
          <button class="btn-circle" id="add-chapter" title="增加新章">+</button>
        </div>
      </div>
      <div class="scroll-area" id="chapter-list">
        <!-- JS 動態生成 -->
      </div>
    </div>

    <div class="resizer" data-index="5"></div>

    <!-- 編輯器 -->
    <div class="col">
      <div class="col-header">
        <h3>🖋️ 內文編輯器</h3>
        <div class="toolbox">
          <button class="ai-btn" id="btn-ai-gen-all-content" title="撰寫所有未鎖定的小節內文">🤖 AI全節內文</button>
          <button class="ai-btn" id="btn-ai-gen-content" title="撰寫本小節內文">🤖 AI本節內文</button>
        </div>
      </div>
      <div class="scroll-area" id="editor-side">
        <textarea class="editor-title" id="active-section-title" placeholder="請選擇一個章節開始" readonly></textarea>
        <textarea id="main-editor" placeholder="在此編寫故事內容..."></textarea>
      </div>
    </div>
  </div>
  <!-- ── Modal: Save Novel ── -->
  <div id="modal-novel-save" class="modal-overlay hidden">
    <div class="modal-box modal-box-sm">
      <h3 class="modal-title">💾 儲存小說專案</h3>
      <div class="modal-field">
        <label class="modal-label">小說名稱：</label>
        <input type="text" id="save-novel-name">
      </div>
      <div class="modal-field-last">
        <label class="modal-label">密碼 (雲端存取用)：</label>
        <input type="password" id="save-novel-password">
      </div>
      <div class="modal-actions">
        <button id="btn-save-cancel" class="btn-modal-cancel">取消</button>
        <button id="btn-save-confirm" class="btn-modal-confirm">確定儲存</button>
      </div>
    </div>
  </div>

  <!-- ── Modal: Novel Password Check ── -->
  <div id="modal-novel-password" class="modal-overlay hidden">
    <div class="modal-box modal-box-sm">
      <h3 class="modal-title">🔐 雲端專案驗證</h3>
      <p class="modal-desc">請輸入此小說專案的讀取密碼：</p>
      <input type="password" id="novel-password-input" placeholder="輸入密碼..." style="margin-bottom:20px;">
      <div class="modal-actions">
        <button id="btn-password-cancel" class="btn-modal-cancel">取消</button>
        <button id="btn-password-ok" class="btn-modal-confirm">確定</button>
      </div>
    </div>
  </div>

  <script>
    // Log 輔助功能
    window.clearLogOutput = () => { document.getElementById('log-output').value = ''; };
    window.copyLogOutput = () => {
      const log = document.getElementById('log-output').value;
      navigator.clipboard.writeText(log);
      alert('已複製到剪貼簿');
    };
    window.showLogModal = () => {
      const logBox = document.getElementById('log-output');
      const rawText = logBox.value;
      document.getElementById('system-log-content').value = rawText.replace(/\\n/g, '\n');
      document.getElementById('modal-system-log').classList.remove('hidden');
      document.getElementById('log-search-input').value = '';
      document.getElementById('log-search-count').textContent = '';
    };

    // LOG 彈窗搜尋功能
    (function initLogSearch() {
      let matches = [];
      let currentMatch = -1;

      function goToMatch(idx) {
        if (!matches.length) return;
        const ta = document.getElementById('system-log-content');
        const query = document.getElementById('log-search-input').value;
        currentMatch = ((idx % matches.length) + matches.length) % matches.length;
        const start = matches[currentMatch], end = start + query.length;
        ta.focus();
        ta.setSelectionRange(start, end);
        const lh = parseFloat(window.getComputedStyle(ta).lineHeight) || 20;
        const line = ta.value.substring(0, start).split('\n').length - 1;
        ta.scrollTop = Math.max(0, (line - 3) * lh);
        document.getElementById('log-search-count').textContent = `${currentMatch + 1} / ${matches.length}`;
      }

      function doSearch() {
        const query = document.getElementById('log-search-input').value;
        const ta = document.getElementById('system-log-content');
        const countEl = document.getElementById('log-search-count');
        matches = [];
        currentMatch = -1;
        if (!query) { countEl.textContent = ''; ta.focus(); return; }
        const lo = ta.value.toLowerCase(), lq = query.toLowerCase();
        let i = 0;
        while ((i = lo.indexOf(lq, i)) !== -1) { matches.push(i); i += lq.length; }
        matches.length ? goToMatch(0) : (countEl.textContent = '找不到', ta.focus());
      }

      window.addEventListener('DOMContentLoaded', () => {
        document.getElementById('log-search-input').addEventListener('keydown', e => {
          if (e.key === 'Enter') { e.preventDefault(); doSearch(); }
        });
        document.getElementById('log-search-prev').addEventListener('click', () => goToMatch(currentMatch - 1));
        document.getElementById('log-search-next').addEventListener('click', () => goToMatch(currentMatch + 1));
      });
    })();

    // --- 欄位拖拉縮放邏輯 ---
    (function initResizableColumns() {
      const grid = document.getElementById('main-columns-grid');
      const resizers = document.querySelectorAll('.resizer');
      let isResizing = false;
      let currentResizer = null;

      // 儲存每個直欄的比例 (fr)
      // 初始比例根據預設寬度設定
      let colFractions = [192, 320, 500, 400]; // 概略對應 12rem, 20rem, 1fr, 25rem

      function updateGridTemplate() {
        const charCol = document.getElementById('char-col-container');
        const premiseCol = document.getElementById('story-premise-container');

        let template = [];
        // Col 0
        template.push(charCol.classList.contains('collapsed') ? '30px' : `${colFractions[0]}fr`);
        template.push('4px'); // Resizer 1
        // Col 1
        template.push(premiseCol.classList.contains('collapsed') ? '30px' : `${colFractions[1]}fr`);
        template.push('4px'); // Resizer 2
        // Col 2
        template.push(`${colFractions[2]}fr`);
        template.push('4px'); // Resizer 3
        // Col 3
        template.push(`${colFractions[3]}fr`);

        grid.style.gridTemplateColumns = template.join(' ');
      }

      // 初始化比例
      function initFractions() {
        const gridStyle = window.getComputedStyle(grid);
        const computedCols = gridStyle.gridTemplateColumns.split(' ');
        if (computedCols.length >= 7) {
          colFractions = [
            parseFloat(computedCols[0]),
            parseFloat(computedCols[2]),
            parseFloat(computedCols[4]),
            parseFloat(computedCols[6])
          ];
          updateGridTemplate();
        }
      }

      // 延遲初始化以確保瀏覽器已完成初步版面計算
      if (document.readyState === 'complete') {
        setTimeout(initFractions, 200);
      } else {
        window.addEventListener('load', () => setTimeout(initFractions, 200));
      }

      resizers.forEach(resizer => {
        resizer.addEventListener('mousedown', (e) => {
          isResizing = true;
          currentResizer = resizer;
          resizer.classList.add('resizing');
          document.body.classList.add('resizing-active');

          const index = parseInt(resizer.getAttribute('data-index'));
          const targetColIdx = Math.floor(index / 2); // Res 1 -> Col 0, Res 3 -> Col 1, Res 5 -> Col 2

          const onMouseMove = (moveEvent) => {
            if (!isResizing) return;

            const gridRect = grid.getBoundingClientRect();
            const mouseX = moveEvent.clientX - gridRect.left;
            const totalAvailWidth = gridRect.width - 12; // 扣除 3 個 4px resizer

            // 計算目標欄位的新像素寬度
            let newWidthPx = 0;
            if (index === 1) {
              newWidthPx = mouseX;
            } else if (index === 3) {
              const r1Pos = resizers[0].getBoundingClientRect().right - gridRect.left;
              newWidthPx = mouseX - r1Pos;
            } else if (index === 5) {
              const r2Pos = resizers[1].getBoundingClientRect().right - gridRect.left;
              newWidthPx = mouseX - r2Pos;
            }

            const minWidth = 50;
            const maxWidth = totalAvailWidth - 150;
            newWidthPx = Math.max(minWidth, Math.min(newWidthPx, maxWidth));

            // 公式：newFr = (newWidthPx * sumOfOtherFrs) / (totalAvailWidth - newWidthPx)
            // 這能確保目標欄位寬度為 newWidthPx，且其他欄位依比例縮放
            const otherFrSum = colFractions.reduce((sum, fr, i) => i === targetColIdx ? sum : sum + fr, 0);
            const newFr = (newWidthPx * otherFrSum) / (totalAvailWidth - newWidthPx);

            if (newFr > 0 && isFinite(newFr)) {
              colFractions[targetColIdx] = newFr;
              updateGridTemplate();
            }
          };

          const onMouseUp = () => {
            isResizing = false;
            currentResizer.classList.remove('resizing');
            document.body.classList.remove('resizing-active');
            document.removeEventListener('mousemove', onMouseMove);
            document.removeEventListener('mouseup', onMouseUp);
          };

          document.addEventListener('mousemove', onMouseMove);
          document.addEventListener('mouseup', onMouseUp);
        });
      });

      // 處理折疊按鈕
      const setupToggle = (btnId, containerId) => {
        const btn = document.getElementById(btnId);
        if (btn) {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const container = document.getElementById(containerId);
            container.classList.toggle('collapsed');
            updateGridTemplate();
          });
        }
      };

      setupToggle('toggle-char-col', 'char-col-container');
      setupToggle('toggle-premise', 'story-premise-container');

    })();
  </script>
  <script src="js/novel_generator_app.js" defer></script>
  <!-- ── Modal: System Message LOG ── -->
  <div id="modal-system-log" class="modal-overlay hidden">
    <div class="modal"
      style="background-color: var(--c-bg-card-light); width: 80%; height: 80%; display: flex; flex-direction: column; max-width: none;">
      <div class="modal-header-bar"
        style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-shrink: 0;">
        <h2 class="modal-title" style="margin:0;">系統訊息 LOG</h2>
        <button class="modal-close-btn"
          onclick="document.getElementById('modal-system-log').classList.add('hidden')">&times;</button>
      </div>
      <div class="log-search-bar" style="flex-shrink: 0;">
        <span class="log-search-icon">🔍</span>
        <span id="log-search-count" class="log-search-count"></span>
        <button class="log-search-nav-btn" id="log-search-prev" title="上一個">▲</button>
        <button class="log-search-nav-btn" id="log-search-next" title="下一個">▼</button>
        <input type="text" id="log-search-input" class="log-search-input" placeholder="搜尋 LOG 文字（Enter 執行）...">
      </div>
      <div class="modal-body-area">
        <textarea id="system-log-content" class="modal-log-textarea" readonly></textarea>
      </div>
    </div>
  </div>
</body>

</html>
